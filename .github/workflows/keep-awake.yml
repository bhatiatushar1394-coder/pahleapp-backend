name: Keep Render awake

on:
  schedule:
    # Render Free spins down after 15 minutes with no inbound HTTP.
    # Ping every 10 minutes. GitHub cron can run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit health endpoint
        run: |
          set -euo pipefail
          url="https://pahleapp-backend.onrender.com/api/health/"
          # Cold start after sleep can take ~30–60s.
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 "$url"
